name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  # First job: Check if the triggering actor has write permission
  check-permissions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-permission: ${{ steps.check.outputs.has-permission }}
    steps:
      - name: Check actor permissions
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const actorLogin = context.actor;
            const repo = context.repo;
            
            try {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: repo.owner,
                repo: repo.repo,
                username: actorLogin
              });
              
              // Only allow users with write, maintain, or admin permissions
              const hasPermission = ['write', 'maintain', 'admin'].includes(permission.permission);
              console.log(`Actor ${actorLogin} has permission level: ${permission.permission}`);
              console.log(`Has required permission: ${hasPermission}`);
              
              core.setOutput('has-permission', hasPermission.toString());
            } catch (error) {
              console.log(`Error checking permissions for ${actorLogin}: ${error.message}`);
              core.setOutput('has-permission', 'false');
            }

  claude:
    needs: check-permissions
    if: |
      needs.check-permissions.outputs.has-permission == 'true' &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full depth for better git operations
          persist-credentials: false # Prevent credential exposure to subsequent steps

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Specify model (defaults to Claude Sonnet 4, using Claude Opus 4)
          model: "claude-opus-4-20250514"

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Allow Claude to use read-only and safe tools only
          # Removed: Agent, Bash, Edit, MultiEdit, NotebookEdit, TodoWrite, Write
          # These tools could be exploited via prompt injection to modify repository content
          allowed_tools: |
            Glob,
            Grep,
            LS,
            NotebookRead,
            Read,
            TodoRead,
            WebFetch,
            WebSearch

          # Custom instructions - Read-only advisory mode
          custom_instructions: |
            ### IMPORTANT: Read-Only Advisory Mode
            
            You are operating in READ-ONLY mode. You CANNOT and MUST NOT:
            - Modify, edit, or write any files
            - Execute bash commands or scripts
            - Commit or push changes
            - Create or modify pull requests beyond commenting
            
            Your role is to provide advice, analysis, and recommendations only.
            
            ### 1. General Principles
            
            - Provide conversational responses with code analysis and recommendations
            - Review code and suggest improvements, but do not make changes
            - Follow all **CODING_RULES.md** files in each project directory when providing advice
            - Recommend minimal changes when suggesting improvements
            - Avoid suggesting "defensive" patterns (default values, removing tests, non-null assertions)
            
            ### 2. Code Analysis & Recommendations
            
            - When analyzing TypeScript code, reference `npx tsc --noEmit` for type checking
            - When analyzing Rust code, reference `cargo check` for validation
            - Provide specific file locations and line numbers when suggesting changes
            - Explain the reasoning behind recommendations
            
            ### 3. Error Handling Guidance
            
            - Recommend letting exceptions propagate rather than catching unnecessarily
            - Suggest using `Result<T, E>` only when downstream handling is required
            - Recommend `try/catch` solely to convert external library errors
            - Suggest using `normalizeError()` instead of `err as Error`
            
            ### 4. Internet Access
            
            - Use WebSearch tools to find documentation for libraries, latest package versions, etc.
            - Reference official documentation when providing recommendations
            
            ### Project Structure Reference:
            
            **front**: TypeScript project - npm ci && npx tsc --noEmit && npm run lint
            **connectors**: TypeScript project - npm install && npm run build && npm run lint
            **cli**: TypeScript project - npm ci && npx tsc && npm run lint
            **core**: Rust project - cargo check && cargo fmt --all -- --check
            **extension**: TypeScript project - npm ci && npm run build && npm run lint
            **sparkle**: TypeScript project - npm install && npm run build && npm run lint
            **viz**: TypeScript project - npm install && npm run build && npm run check
            **sdks/js**: Pre-built TypeScript SDK
            
            ### Response Guidelines:
            
            - Be helpful and provide actionable advice
            - When asked to make changes, explain what should be changed and why
            - Provide code examples in your responses when helpful
            - Reference project coding standards when applicable

          # Environment variables for Claude
          claude_env: |
            NODE_ENV: test
